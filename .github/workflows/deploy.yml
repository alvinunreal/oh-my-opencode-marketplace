name: Deploy registry

on:
  workflow_dispatch:

concurrency:
  group: registry-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run verify-main
      - run: bun run verify-additive
      - run: bun run build
      - run: bun run verify-generated
      - run: bun run validate
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test deployed registry
        run: bash scripts/verify-deployment.sh
        env:
          DEPLOY_SMOKE_CACHE_BUST: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
